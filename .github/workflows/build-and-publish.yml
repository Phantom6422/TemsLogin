name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build with Gradle
        run: ./gradlew spotlessCheck build

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemsLogin
          path: Plugin/build/libs/TemsLogin-*.jar

      - name: Setup Velocity environment
        run: |
          mkdir -p velocity/plugins
          cp Plugin/build/libs/TemsLogin-*.jar velocity/plugins/
          curl -sL https://fill-data.papermc.io/v1/objects/01e37982e92f78465c950ef6b5ebe9fd4f94f11a11868c95682b2ee99f7409bb/velocity-4.3.2-SNAPSHOT-48.jar -o velocity/velocity.jar

      - name: Run Velocity
        run: |
          cd velocity
          java -jar velocity.jar

      - name: Publish with Gradle
        if: github.repository == 'kyngs/LibreLogin' && github.ref == 'refs/heads/main'
        run: ./gradlew :API:publish -PkyngsRepoUsername=${{ secrets.KYNGS_REPO_TOKEN }} -PkyngsRepoPassword=${{ secrets.KYNGS_REPO_SECRET }}

      - name: Update Wiki
        if: github.repository == 'kyngs/LibreLogin' && github.ref == 'refs/heads/main'
        run: |
          git clone https://github.com/kyngs/LibreLogin.wiki.git wiki
          cd wiki
          echo '```hocon' > Config.md && cat ../velocity/plugins/temslogin/config.conf >> Config.md && echo '```' >> Config.md
          echo '```hocon' > Messages.md && cat ../velocity/plugins/temslogin/messages.conf >> Messages.md && echo '```' >> Messages.md
          git config --local user.email 'kyngs@users.noreply.github.com'
          git config --local user.name 'Kyngs CI (GitHub Actions)'
          git add .
          git diff-index --quiet HEAD || git commit -m 'Update configuration and messages on wiki' && git push https://kyngs:${{ secrets.GITHUB_TOKEN }}@github.com/kyngs/LibreLogin.wiki.git

      - name: Release
        if: github.repository == 'kyngs/LibreLogin' && startsWith(github.ref, 'refs/tags/')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: ./gradlew :Plugin:release -PbuildTarget=release
